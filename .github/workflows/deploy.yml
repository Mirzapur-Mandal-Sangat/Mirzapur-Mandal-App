name: Deploy Mirzapur Mandal App

on:
  push:
    branches: [ "main" ] 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Insert Secret Link into HTML
        env:
          SECRET_URL: ${{ secrets.LINK }}
        run: |
          sed -i "s|__SECRET_LINK_HERE__|$SECRET_URL|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
